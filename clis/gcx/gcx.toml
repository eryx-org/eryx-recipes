# Build manifest for the Grafana CLI (`gcx`) as a WASI component.
# Built by `mise run build-cli -- gcx`, which needs the wasip3 Go fork
# (scripts/bootstrap-go-wasip3.sh, or set ERYX_GO_WASIP3_ROOT), like gh.
#
# gcx publishes its own wasip1 build (experimental/sandbox), but that one
# sends HTTP through a custom `gcx_http` host import; this one uses the
# fork's wasi:http-backed net/http, so it runs in eryx like gh does.
#
# It builds for wasm32, whose code addresses fit about 61,000 functions, so
# clis/gcx/patches/patch-gcx-vendor.sh leaves out what gcx's wasip1 build does
# (`gcx dev`, otel-checker, glamour) and the Grafana API services gcx doesn't
# call.
#
# At runtime gcx needs a real (non-symlinked) /etc/resolv.conf, a CA bundle
# (SSL_CERT_FILE or certs under /etc), and the component-model async flags
# that clis/gcx/smoke.sh passes.

name = "gcx"
description = "Grafana CLI"
license = "Apache-2.0"
lang = "go"

[source]
repo = "https://github.com/grafana/gcx.git"
ref = "v1.9.0"
commit = "7893f846f459408daa347b8ab4d12c30324387c5"
dir = "scratch/gcx"

[build]
package = "./cmd/gcx"
# wasip3 stubs, build-constraint fixes and the trimming above.
vendor_patch = "clis/gcx/patches/patch-gcx-vendor.sh"
# main.commit is source.commit; main.date is fixed so builds don't vary by day.
ldflags = "-s -X main.version={version} -X main.commit=7893f846f459408daa347b8ab4d12c30324387c5 -X main.date=1970-01-01T00:00:00Z"

[build.go_toolchain]
# The wasip3 Go fork to build with, overriding eryx-build's default pin
# (GoToolchain::default) until the next vars.eryx_rev bump picks it up. Must
# match scripts/bootstrap-go-wasip3.sh, which CI builds the toolchain with.
# gcx needs its notetsleepg fix: it calls signal.NotifyContext at startup.
repo = "https://github.com/sd2k/go.git"
ref = "wasip3-0.3.0-go1.27.4-branches-notetsleepg"
commit = "d09b5e114a563faeda64feaeb6d1b0256ddc5641"

[component]
world = "command"

[cwasm]
enabled = false

[output]
dir = "scratch/gcx-component"
