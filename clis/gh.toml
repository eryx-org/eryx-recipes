# Build manifest for the GitHub CLI (`gh`) as a WASI component.
# Built by `mise run build-cli -- gh`, which needs the wasip3 Go fork
# (scripts/bootstrap-go-wasip3.sh, or set ERYX_GO_WASIP3_ROOT). The script
# sets GOWASM=widearith in the toolchain's go.env, so the component uses
# wasm wide-arithmetic, which wasmtime (and so eryx) enables by default.
#
# At runtime gh needs a real (non-symlinked) /etc/resolv.conf, a CA bundle
# (SSL_CERT_FILE or certs under /etc), and the component-model async flags
# that clis/smoke.sh passes.

name = "gh"
description = "GitHub CLI"
# SPDX expression for the upstream source, recorded in provenance.json.
license = "MIT"
lang = "go"

[source]
repo = "https://github.com/cli/cli.git"
ref = "v2.87.3"
commit = "cf862d65df7f8ff528015e235c8cccd48cea286f"
# Local working copy the driver builds from; fetched on first build.
dir = "scratch/gh-cli"

[build]
# Go package to build, relative to the source dir.
package = "./cmd/gh"
# Script applied after `go mod vendor` to stub out wasip3-incompatible code,
# speed up startup and leave out `codespace`, `attestation` and `release
# verify[-asset]` (clis/patches/gh-*.patch).
vendor_patch = "clis/patches/patch-gh-vendor.sh"
# Report the pinned release instead of `DEV`. `-s` drops the wasm name
# section (2.2 MB); Go's own panics still name functions, from pclntab.
ldflags = "-s -X github.com/cli/cli/v2/internal/build.Version={version}"

# The fork with the notetsleepg fix (signal.Notify no longer starves async
# I/O), until eryx-build's default pin moves to it. Same pin as
# scripts/bootstrap-go-wasip3.sh.
[build.go_toolchain]
repo = "https://github.com/sd2k/go.git"
ref = "wasip3-0.3.0-go1.27.4-notetsleepg"
commit = "0281ae4a6ff5470bd07dc400674d1f94731b50e4"

[component]
# wasm-tools component world to embed.
world = "command"

[cwasm]
# Loaded as a plain component; the host compiles it on demand.
enabled = false

[output]
# Where the built component (and optional cwasm) is written.
dir = "scratch/gh-component"
