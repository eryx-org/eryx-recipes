# Build manifest for uutils diffutils (`diff`, `cmp`) as a WASI (wasip2)
# component, via the Rust lane. Built by `mise run build-cli -- diffutils`.
#
# One multicall binary that picks the tool from argv[0], so the host
# registers it as both `diff` and `cmp` (`names` in its publish.toml). It builds
# for wasip2 as it is. It's pinned to main after 0.6.0, which adds `-r`; the
# patch splits bundled short options (`-ru`, `-Naur`), which upstream rejects
# as unrecognized. Recursive diffs' per-file headers then show the options
# split (`diff -r -u a/f b/f`, where GNU shows `diff -ru`).

name = "diffutils"
description = "diff and cmp — uutils' GNU-compatible diffutils (Rust, wasip2)"
# SPDX expression for the upstream source, recorded in provenance.json.
license = "MIT OR Apache-2.0"
lang = "rust"

[source]
repo = "https://github.com/uutils/diffutils.git"
# main after 0.6.0, for `-r` (uutils/diffutils#162); move to 0.7.0 once it's
# tagged.
ref = "main"
commit = "feb8997eeabbab58c31926ac3aaa1211189f4f4f"
dir = "scratch/diffutils"

[build]
bin = "diffutils"
vendor_patch = "clis/diffutils/patches/patch-diffutils.sh"

[cwasm]
# Loaded as a plain component; the host compiles it on demand.
enabled = false

[output]
dir = "scratch/diffutils-component"
