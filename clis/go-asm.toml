# Build manifest for Go's `asm` tool, as the command `go-asm`, from the
# wasip3 Go fork itself (eryx-build's `std_tool`), via the Go lane. Built by
# `mise run build-cli -- go-asm`.
#
# `go` (clis/go.toml) runs it through eryx:process/run under this name;
# go-wasip3.patch makes its `-V` output say `asm`, as go expects. It
# builds from the same patched checkout as `go`.

name = "go-asm"
description = "Go's asm tool, which go runs (wasip3 Go fork)"
# SPDX expression for the upstream source, recorded in provenance.json.
license = "BSD-3-Clause"
lang = "go"

[source]
# The fork at the commit the Go lane builds with: std_tool builds need both.
repo = "https://github.com/sd2k/go.git"
ref = "wasip3-0.3.0-go1.27.4-branches"
commit = "f2006e361e755199dce61ff823137c8711d20ea9"
dir = "scratch/go-src"

[build]
package = "cmd/asm"
std_tool = true
vendor_patch = "clis/patches/patch-go.sh"

[build.go_toolchain]
# The wasip3 Go fork to build with, overriding eryx-build's default pin
# (GoToolchain::default) until the next vars.eryx_rev bump picks it up. Must
# match scripts/bootstrap-go-wasip3.sh, which CI builds the toolchain with.
repo = "https://github.com/sd2k/go.git"
ref = "wasip3-0.3.0-go1.27.4-branches"
commit = "f2006e361e755199dce61ff823137c8711d20ea9"

[cwasm]
# Loaded as a plain component; the host compiles it on demand.
enabled = false

[output]
dir = "scratch/go-asm-component"
