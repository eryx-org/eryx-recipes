# Build manifest for sed (`sed`) as a WASI (wasip2) component, via the Rust
# lane. Built by `mise run build-cli -- sed`.
#
# uutils' sed, a GNU-compatible sed in Rust. It builds for wasip2 as it is;
# the patch only makes the `e` command and the s///e flag, which run a shell
# command, fail with a message instead of panicking (a WASI command can't
# start a shell). Known gaps against GNU sed 4.9: `\b` (word boundary) never
# matches, and the case-conversion escapes (`\U`, `\L`, `\E`, ...) aren't
# implemented (uutils/sed#540).

name = "sed"
description = "sed — uutils' GNU-compatible stream editor (Rust, wasip2)"
# SPDX expression for the upstream source, recorded in provenance.json.
license = "MIT"
lang = "rust"

[source]
repo = "https://github.com/uutils/sed.git"
ref = "0.3.0"
commit = "3b464d115afddedf2271ff7b3d9564aa2103d752"
dir = "scratch/sed"

[build]
bin = "sed"
vendor_patch = "clis/sed/patches/patch-sed.sh"
# Let the pinned stable toolchain use the unstable wasip2 feature (rustix
# needs it), as for coreutils.
[build.env]
RUSTC_BOOTSTRAP = "1"

[cwasm]
# Loaded as a plain component; the host compiles it on demand.
enabled = false

[output]
dir = "scratch/sed-component"
