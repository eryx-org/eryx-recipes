name: Commands toolchain
description: >-
  Every command lane's toolchain, where scripts/sandbox.py mounts it from:
  eryx-build at mise.toml's eryx_rev, the pinned Rust with wasm32-wasip2,
  wasmtime, wasm-tools and wit-bindgen (mise), the WASI SDK, and the wasip3
  Go fork in scratch/go-wasip3 (from main's cache when there is one). A Go
  build outside the sandbox needs ERYX_GO_WASIP3_ROOT set to that.

# sandbox.yml's builds and commands-agent.yml's agent, which doesn't know its
# command's lane until it has written the manifest, so gets them all.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-binstall
    - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      with:
        version: 2026.11.12
        install_args: rust aqua:bytecodealliance/wasmtime cargo:wasm-tools github:bytecodealliance/wit-bindgen
        cache: false
    - uses: ./.github/actions/eryx-build
    - shell: bash
      run: rustup target add wasm32-wasip2
    - shell: bash
      run: mise run ensure-wasi-sdk
    # The fork as ci.yml's Go lane builds it, from its cache when main has
    # saved one
    - name: Restore the wasip3 Go toolchain
      id: go-wasip3-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: scratch/go-wasip3
        key: go-wasip3-${{ hashFiles('scripts/bootstrap-go-wasip3.sh') }}
    - if: steps.go-wasip3-cache.outputs.cache-hit != 'true'
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: '1.27'
        cache: false
    - name: Bootstrap the wasip3 Go toolchain
      shell: bash
      run: |
        if [ ! -x scratch/go-wasip3/bin/go ]; then
          GOROOT_BOOTSTRAP="$(go env GOROOT)"
          export GOROOT_BOOTSTRAP
        fi
        scripts/bootstrap-go-wasip3.sh scratch/go-wasip3
