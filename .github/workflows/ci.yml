# Build every command in clis/ with eryx-build (pinned in mise.toml) and
# smoke-test it under the wasmtime CLI (clis/smoke.sh).
#
# Which lanes run when:
# - Rust (rg, sd, jaq) and C (sqlite3, curl, jq, git): when the build pins
#   (mise.toml), this workflow, smoke.sh or one of the lane's manifests,
#   patches, shims or WIT change.
# - Go (gh): only when its manifest, patch or the Go-fork bootstrap change. It
#   builds the wasip3 Go fork from source (cached), so it is the slow one.
# - Everything weekly, to catch upstream and toolchain bit-rot, and on demand.
#
# Each component is uploaded as a workflow artifact with its manifest.toml and
# provenance.json. Then every run publishes what it built (#5):
# - to a throwaway registry on the runner, always (the dry run): the push is
#   read back and checked, and the would-be commands.lock is uploaded;
# - to ghcr.io/eryx-org/commands, only from a manual run with `publish` set,
#   after the dry run passes and the ghcr-publish environment approves.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1' # Mondays
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built commands to ghcr.io (versions already there are skipped)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    # A job's permissions replace the workflow's, and checkout needs contents
    # in a private repo.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      c: ${{ steps.filter.outputs.c }}
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # eryx-build, the toolchains and the WIT are pinned in mise.toml.
            driver: &driver
              - 'clis/smoke.sh'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            rust:
              - *driver
              - 'clis/rg.toml'
              - 'clis/sd.toml'
              - 'clis/jaq.toml'
              - 'clis/patches/patch-sd-wasip2.sh'
              - 'clis/patches/patch-jaq-wasip2.sh'
            c:
              - *driver
              - 'clis/curl.toml'
              - 'clis/sqlite3.toml'
              - 'clis/jq.toml'
              - 'clis/patches/patch-curl.sh'
              - 'clis/patches/patch-mbedtls.sh'
              - 'clis/shims/**'
              - 'clis/gpl/git/**'
              # git's eryx:process/run bindings are generated from it.
              - 'wit/**'
            go:
              - 'clis/gh.toml'
              - 'clis/patches/patch-gh-vendor.sh'
              - 'scripts/bootstrap-go-wasip3.sh'
              # eryx-build's Go lane is pinned there.
              - 'mise.toml'

  check:
    name: Check manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # check-versions diffs against the PR's base.
          fetch-depth: 0
      - uses: ./.github/actions/setup-binstall
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          install_args: rust
          cache: false
      - uses: ./.github/actions/eryx-build
      - run: mise run check-clis
      # The vendored eryx WIT matches eryx's at the pinned commit.
      - run: mise run check-wit
      - run: python3 -m unittest discover -s scripts
      # Every recipe has a version in commands.toml, matching its upstream;
      # on a PR, every command whose build inputs changed has a new one.
      - name: Check commands.toml
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: python3 scripts/publish.py check-versions ${BASE:+--base "$BASE"}

  rust:
    name: Build ${{ matrix.cli }} (Rust lane)
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cli: [rg, sd, jaq]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-binstall
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          install_args: rust aqua:bytecodealliance/wasmtime
          cache: false
      - uses: ./.github/actions/eryx-build
      - run: rustup target add wasm32-wasip2
      - run: mise run build-cli -- "$CLI"
        env:
          CLI: ${{ matrix.cli }}
      - run: clis/smoke.sh "$CLI"
        env:
          CLI: ${{ matrix.cli }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.cli }}-component
          path: |
            scratch/${{ matrix.cli }}-component/component.wasm
            scratch/${{ matrix.cli }}-component/*.cwasm
            scratch/${{ matrix.cli }}-component/manifest.toml
            scratch/${{ matrix.cli }}-component/provenance.json
          if-no-files-found: error
          retention-days: 14

  c:
    name: Build ${{ matrix.cli }} (C lane)
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.c == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cli: [sqlite3, curl, jq, git]
        include:
          # GPL recipes live apart, in clis/gpl/ (eryx-org/eryx#837).
          - cli: git
            manifest: clis/gpl/git/git.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-binstall
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          # wit-bindgen for git's bindings, wasm-tools for its smoke check.
          install_args: rust aqua:bytecodealliance/wasmtime github:bytecodealliance/wit-bindgen cargo:wasm-tools
          cache: false
      - uses: ./.github/actions/eryx-build
      # The CMake builds use Ninja, which the runner doesn't ship.
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      # Every C build links the rustc-built start-in-$PWD object (eryx-org/eryx#978).
      - run: rustup target add wasm32-wasip2
      - run: mise run ensure-wasi-sdk
      - run: mise run build-cli -- "$MANIFEST"
        env:
          MANIFEST: ${{ matrix.manifest || matrix.cli }}
      - run: clis/smoke.sh "$CLI"
        env:
          CLI: ${{ matrix.cli }}
      # A GPL component ships with its licence and our notice (eryx-org/eryx#837).
      - name: Add git's licence and notice
        if: matrix.cli == 'git'
        run: cp scratch/git/COPYING clis/gpl/git/NOTICE.md scratch/git-component/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.cli }}-component
          path: |
            scratch/${{ matrix.cli }}-component/component.wasm
            scratch/${{ matrix.cli }}-component/*.cwasm
            scratch/${{ matrix.cli }}-component/manifest.toml
            scratch/${{ matrix.cli }}-component/provenance.json
            scratch/${{ matrix.cli }}-component/COPYING
            scratch/${{ matrix.cli }}-component/NOTICE.md
          if-no-files-found: error
          retention-days: 14

  go:
    name: Build gh (Go lane)
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-binstall
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          install_args: rust cargo:wasm-tools aqua:bytecodealliance/wasmtime
          cache: false
      - uses: ./.github/actions/eryx-build
      # Building the fork from source takes ~10 minutes; key it on the script,
      # which pins the fork's commit.
      - name: Cache wasip3 Go toolchain
        id: go-wasip3-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scratch/go-wasip3
          key: go-wasip3-${{ hashFiles('scripts/bootstrap-go-wasip3.sh') }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: Bootstrap wasip3 Go toolchain
        run: |
          GOROOT_BOOTSTRAP="$(go env GOROOT)"
          export GOROOT_BOOTSTRAP
          GOROOT="$(scripts/bootstrap-go-wasip3.sh scratch/go-wasip3)"
          echo "ERYX_GO_WASIP3_ROOT=$GOROOT" >> "$GITHUB_ENV"
      # Pushes to main save; PRs and the weekly run only restore (a PR's
      # caches are scoped to it, and would only evict main's).
      - name: Save wasip3 Go toolchain
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.go-wasip3-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scratch/go-wasip3
          key: ${{ steps.go-wasip3-cache.outputs.cache-primary-key }}
      - run: mise run build-cli -- gh
      - run: clis/smoke.sh gh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gh-component
          path: |
            scratch/gh-component/component.wasm
            scratch/gh-component/*.cwasm
            scratch/gh-component/manifest.toml
            scratch/gh-component/provenance.json
          if-no-files-found: error
          retention-days: 14

  # Publish what this run built to a throwaway registry on the runner, and read
  # it back: everything a real publish does except the destination.
  publish-dry-run:
    name: Publish (dry run)
    needs: [check, rust, c, go]
    if: ${{ !cancelled() && needs.check.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-binstall
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          install_args: cargo:wkg
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-component'
          path: scratch
      - name: Publish to the local registry
        id: publish
        run: |
          shopt -s nullglob
          dirs=(scratch/*-component)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "Nothing was built, so there's nothing to publish."
            echo "results=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/publish.py publish --registry localhost:5000 --insecure \
            --fail-existing --out scratch/results.json "${dirs[@]}"
          python3 scripts/publish.py lock --results scratch/results.json
          cat scratch/results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-dry-run
          path: |
            scratch/results.json
            commands.lock
          if-no-files-found: ignore
          retention-days: 14

  # The real publish: manual runs with `publish` set only, after the dry run,
  # behind the ghcr-publish environment's approval. Packages are private and
  # linked to this repo (org.opencontainers.image.source).
  publish:
    name: Publish to ghcr.io
    needs: publish-dry-run
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: ghcr-publish
    permissions:
      contents: read
      packages: write
    outputs:
      # What was pushed: each command's reference, layer digest and
      # manifest_digest. Signing and attestations (#6) attach to the latter,
      # in a job that `needs: publish` (with `id-token: write`).
      results: ${{ steps.publish.outputs.results }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-binstall
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          install_args: cargo:wkg
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-component'
          path: scratch
      - name: Publish to ghcr.io
        id: publish
        env:
          WKG_OCI_USERNAME: ${{ github.actor }}
          WKG_OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/publish.py publish --registry ghcr.io \
            --out scratch/results.json scratch/*-component
          python3 scripts/publish.py lock --results scratch/results.json
          echo "results=$(jq -c . scratch/results.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published
          path: |
            scratch/results.json
            commands.lock
          retention-days: 90

  # Record the new versions in commands.lock through a PR, so the index changes
  # are reviewed like any other.
  record:
    name: Record in commands.lock
    needs: publish
    if: ${{ needs.publish.outputs.results != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: published
          path: scratch/published
      - name: Open a PR
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          cp scratch/published/commands.lock commands.lock
          branch="publish/run-$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add commands.lock
          git commit -m "chore: record the commands published by run $RUN_ID"
          git push "https://x-access-token:$GH_TOKEN@github.com/$REPO" "$branch"
          gh pr create --head "$branch" --title "chore: record published commands (run $RUN_ID)" \
            --body "Versions published by https://github.com/$REPO/actions/runs/$RUN_ID, from its results.json."
