# Build every command in clis/ with eryx-build (pinned in mise.toml) and
# smoke-test it under the wasmtime CLI (clis/smoke.sh).
#
# Which commands build when (`scripts/publish.py matrix`, in the changes job,
# reads every command's directory, so adding one needs nothing here):
# - On pushes and PRs, each command whose directory (clis/<name>/) or other
#   build inputs (shared patches, WIT, its lane's files) changed, in its
#   manifest's lane (Rust, C or Go), and every command when what they all
#   share does: the build pins (mise.toml), this workflow, its actions,
#   clis/smoke.sh, publish.py, or what the notices are made from.
# - Everything weekly, to catch upstream and toolchain bit-rot, and on demand.
#
# A command building doesn't mean rebuilding it. On pushes and PRs, each
# command's built component dir (component, cwasm, manifest, provenance,
# notices, SBOM) is cached under a hash of everything it's made from
# (`scripts/publish.py cache-key`): its recipe and the patches, shims and WIT
# it names, the pinned eryx-build and toolchains, its publish.toml, its
# notice entries and their files, and the notices generator.
# On a hit the build is skipped, but the smoke test still runs, so a smoke.sh
# change re-checks every command without rebuilding it. Bump the key's `v1`
# for a change to this workflow's build steps that the hash doesn't see.
#
# The weekly run and manual runs (so every publish) never read the cache:
# they build everything from source, so bit-rot still shows up, and what's
# published, signed and attested is always that run's own build.
#
# Each component is uploaded as a workflow artifact with its manifest.toml and
# provenance.json. Then every run publishes what it built (#5):
# - to a throwaway registry on the runner, always (the dry run): the push is
#   read back and checked, and the would-be commands.lock is uploaded;
# - to ghcr.io/eryx-org/commands, only from Ben's manual run on main with
#   `publish` set, after the dry run passes (see the publish job).
# Each published command is then signed, its SLSA provenance attested, and its
# notices (and for GPL commands, a source offer) attached as OCI referrers
# (#6, the sign job). The dry run does the same with a throwaway key.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1' # Mondays
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built commands to ghcr.io (versions already there are skipped)
        type: boolean
        default: false
      tlog_upload:
        description: >-
          Record the signatures in Sigstore's public transparency log (Rekor).
          Off, they carry a Sigstore timestamp instead, and verifying needs
          --insecure-ignore-tlog (see the README)
        type: boolean
        default: true
      sign_run_id:
        description: >-
          Sign and attach what an earlier run published, by its run ID,
          instead of building and publishing (see the sign job)
        type: string
        default: ''

# A manual run gets a group of its own, so a push to main queued behind it
# can't cancel it while it waits (GitHub keeps one pending run per group).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    # A job's permissions replace the workflow's, and checkout needs contents
    # in a private repo.
    permissions:
      contents: read
    outputs:
      # Where the build lanes run: the eryx-desktop runner (eryx-org/eryx-run's
      # scripts/desktop-runner) when the DESKTOP_RUNNER repo variable is `on`,
      # for pushes to main and same-repo PRs; ubuntu-latest otherwise. The
      # weekly and manual runs build what's published, signed and attested,
      # so they always use GitHub's runners. A fork can edit this expression,
      # so it isn't the fork boundary (should the repo go public): the runner
      # group's public-repo setting and the approval requirement for outside
      # contributors are.
      runner: >-
        ${{ (vars.DESKTOP_RUNNER == 'on'
        && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
        || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)))
        && '["self-hosted","eryx-desktop"]' || '"ubuntu-latest"' }}
      # Each lane's commands to build, as a JSON list of {cli, wasi_sdk?}
      # (`[]` skips the lane).
      rust: ${{ steps.matrix.outputs.rust }}
      c: ${{ steps.matrix.outputs.c }}
      go: ${{ steps.matrix.outputs.go }}
    steps:
      # The matrix diffs against the PR's base or the push's before commit,
      # so it needs them here: full history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: List the commands to build
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          # The weekly and manual runs build everything: no base.
          base=
          case "$EVENT" in
          pull_request) base="$PR_BASE" ;;
          # A push that creates the branch has no before commit.
          push) [ "$BEFORE" = 0000000000000000000000000000000000000000 ] || base="$BEFORE" ;;
          esac
          # Into a file first: through a pipe, a failing matrix would leave
          # the step green and the lanes' matrices empty
          python3 scripts/publish.py matrix ${base:+--base "$base"} > "$RUNNER_TEMP/matrix"
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/matrix"

  check:
    name: Check manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # check-versions diffs against the PR's base.
          fetch-depth: 0
      - uses: ./.github/actions/setup-binstall
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          install_args: rust
          cache: false
      - uses: ./.github/actions/eryx-build
      # coreutils' recipe comes from eryx at vars.coreutils_rev (#7).
      - run: mise run fetch-coreutils
      - run: mise run check-clis
      # Every published command has its notice entries, and they're current.
      - run: mise run notices-check
      # The vendored eryx WIT matches eryx's at the pinned commit.
      - run: mise run check-wit
      - run: python3 -m unittest discover -s scripts
      # Every recipe has a version in its publish.toml, matching its upstream;
      # on a PR, every command whose build inputs changed has a new one.
      - name: Check versions
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: python3 scripts/publish.py check-versions ${BASE:+--base "$BASE"}

  rust:
    name: Build ${{ matrix.cli }} (Rust lane)
    needs: changes
    if: ${{ !inputs.sign_run_id && needs.changes.outputs.rust != '[]' }}
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    strategy:
      fail-fast: false
      matrix:
        # coreutils is among them, built from eryx's recipe, fetched at
        # vars.coreutils_rev in mise.toml (so any change to its pin builds it).
        include: ${{ fromJSON(needs.changes.outputs.rust) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-binstall
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          # cargo-about for the notices, wasm-tools for find's smoke check
          # (which runs on a cache hit too, when build-cli doesn't install it).
          install_args: rust aqua:bytecodealliance/wasmtime cargo:cargo-about cargo:wasm-tools
          cache: false
      # Before the key, which hashes the fetched recipe.
      - if: matrix.cli == 'coreutils'
        run: mise run fetch-coreutils
      - name: Hash the build inputs
        id: key
        env:
          CLI: ${{ matrix.cli }}
        run: |
          hash=$(python3 scripts/publish.py cache-key "$CLI")
          echo "key=component-v1-$CLI-$hash" >> "$GITHUB_OUTPUT"
      # Pushes and PRs only (see the top). An exact key, with no restore-keys:
      # a component built from other inputs must never stand in for this one.
      - name: Restore the built component
        id: cache
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scratch/${{ matrix.cli }}-component
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/eryx-build
      - if: steps.cache.outputs.cache-hit != 'true'
        run: rustup target add wasm32-wasip2
      # A command that pins the WASI SDK compiles C with its clang (find's onig
      # crate compiles Oniguruma).
      - if: matrix.wasi_sdk && steps.cache.outputs.cache-hit != 'true'
        run: mise run ensure-wasi-sdk
      - if: steps.cache.outputs.cache-hit != 'true'
        run: mise run build-cli -- "$CLI"
        env:
          CLI: ${{ matrix.cli }}
      - run: clis/smoke.sh "$CLI"
        env:
          CLI: ${{ matrix.cli }}
      # A published command's notices: its crates (Rust), what it links and
      # its toolchain's libraries. A crate licence cargo-about won't accept
      # fails here.
      - name: Write the notices
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # Not `if published`: a crash there must fail the step, not skip it.
          published=$(python3 scripts/notices.py published "$CLI")
          if [ "$published" = yes ]; then
            mise run notices -- "scratch/$CLI-component" "$CLI"
          fi
        env:
          CLI: ${{ matrix.cli }}
      # Saved from PRs too: a PR's caches are scoped to it (only main's are
      # seen by other branches), and only people with write access can run
      # CI here (the repo is private, so there are no fork PRs). Only after
      # the smoke test and notices pass.
      - name: Save the built component
        if: steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scratch/${{ matrix.cli }}-component
          key: ${{ steps.key.outputs.key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.cli }}-component
          path: |
            scratch/${{ matrix.cli }}-component/component.wasm
            scratch/${{ matrix.cli }}-component/*.cwasm
            scratch/${{ matrix.cli }}-component/manifest.toml
            scratch/${{ matrix.cli }}-component/provenance.json
            scratch/${{ matrix.cli }}-component/*.notices.md
            scratch/${{ matrix.cli }}-component/*.spdx.json
          if-no-files-found: error
          retention-days: 14

  c:
    name: Build ${{ matrix.cli }} (C lane)
    needs: changes
    if: ${{ !inputs.sign_run_id && needs.changes.outputs.c != '[]' }}
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    strategy:
      fail-fast: false
      matrix:
        # git among them: build-cli finds GPL recipes in clis/gpl/
        # (eryx-org/eryx#837).
        include: ${{ fromJSON(needs.changes.outputs.c) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-binstall
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          # wit-bindgen for git's bindings, wasm-tools for its smoke check.
          install_args: rust aqua:bytecodealliance/wasmtime github:bytecodealliance/wit-bindgen cargo:wasm-tools
          cache: false
      - name: Hash the build inputs
        id: key
        env:
          CLI: ${{ matrix.cli }}
        run: |
          hash=$(python3 scripts/publish.py cache-key "$CLI")
          echo "key=component-v1-$CLI-$hash" >> "$GITHUB_OUTPUT"
      # Pushes and PRs only (see the top). An exact key, with no restore-keys:
      # a component built from other inputs must never stand in for this one.
      - name: Restore the built component
        id: cache
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scratch/${{ matrix.cli }}-component
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/eryx-build
      # The CMake builds use Ninja, and awk's parser needs bison; the runner
      # ships neither.
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y ninja-build bison
      # Every C build links the rustc-built start-in-$PWD object (eryx-org/eryx#978).
      - if: steps.cache.outputs.cache-hit != 'true'
        run: rustup target add wasm32-wasip2
      - if: steps.cache.outputs.cache-hit != 'true'
        run: mise run ensure-wasi-sdk
      - if: steps.cache.outputs.cache-hit != 'true'
        run: mise run build-cli -- "$CLI"
        env:
          CLI: ${{ matrix.cli }}
      - run: clis/smoke.sh "$CLI"
        env:
          CLI: ${{ matrix.cli }}
      # A published command's notices: its crates (Rust), what it links and
      # its toolchain's libraries. A crate licence cargo-about won't accept
      # fails here.
      - name: Write the notices
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # Not `if published`: a crash there must fail the step, not skip it.
          published=$(python3 scripts/notices.py published "$CLI")
          if [ "$published" = yes ]; then
            mise run notices -- "scratch/$CLI-component" "$CLI"
          fi
        env:
          CLI: ${{ matrix.cli }}
      # A GPL component ships with its licence and our notice (eryx-org/eryx#837).
      - name: Add git's licence and notice
        if: matrix.cli == 'git' && steps.cache.outputs.cache-hit != 'true'
        run: cp scratch/git/COPYING clis/gpl/git/NOTICE.md scratch/git-component/
      # Saved from PRs too: a PR's caches are scoped to it (only main's are
      # seen by other branches), and only people with write access can run
      # CI here (the repo is private, so there are no fork PRs). Only after
      # the smoke test and notices pass.
      - name: Save the built component
        if: steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scratch/${{ matrix.cli }}-component
          key: ${{ steps.key.outputs.key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.cli }}-component
          path: |
            scratch/${{ matrix.cli }}-component/component.wasm
            scratch/${{ matrix.cli }}-component/*.cwasm
            scratch/${{ matrix.cli }}-component/manifest.toml
            scratch/${{ matrix.cli }}-component/provenance.json
            scratch/${{ matrix.cli }}-component/*.notices.md
            scratch/${{ matrix.cli }}-component/*.spdx.json
            scratch/${{ matrix.cli }}-component/COPYING
            scratch/${{ matrix.cli }}-component/NOTICE.md
          if-no-files-found: error
          retention-days: 14

  go:
    name: Build ${{ matrix.cli }} (Go lane)
    needs: changes
    if: ${{ !inputs.sign_run_id && needs.changes.outputs.go != '[]' }}
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    strategy:
      fail-fast: false
      matrix:
        # go, go-compile, go-asm and go-link each build from their own
        # checkout of the fork (eryx-build's std_tool).
        include: ${{ fromJSON(needs.changes.outputs.go) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-binstall
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          install_args: rust cargo:wasm-tools aqua:bytecodealliance/wasmtime
          cache: false
      - name: Hash the build inputs
        id: key
        env:
          CLI: ${{ matrix.cli }}
        run: |
          hash=$(python3 scripts/publish.py cache-key "$CLI")
          echo "key=component-v1-$CLI-$hash" >> "$GITHUB_OUTPUT"
      # Pushes and PRs only (see the top). An exact key, with no restore-keys:
      # a component built from other inputs must never stand in for this one.
      - name: Restore the built component
        id: cache
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scratch/${{ matrix.cli }}-component
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/eryx-build
      # Building the fork from source takes ~10 minutes; key it on the script,
      # which pins the fork's commit and the GOWASM it writes to go.env. Go's
      # build cache isn't kept, so a new toolchain always builds fresh.
      - name: Cache wasip3 Go toolchain
        id: go-wasip3-cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scratch/go-wasip3
          key: go-wasip3-${{ hashFiles('scripts/bootstrap-go-wasip3.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27'
          cache: false
      - name: Bootstrap wasip3 Go toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          GOROOT_BOOTSTRAP="$(go env GOROOT)"
          export GOROOT_BOOTSTRAP
          GOROOT="$(scripts/bootstrap-go-wasip3.sh scratch/go-wasip3)"
          echo "ERYX_GO_WASIP3_ROOT=$GOROOT" >> "$GITHUB_ENV"
      # Pushes to main save; PRs and the weekly run only restore (a PR's
      # caches are scoped to it, and would only evict main's).
      - name: Save wasip3 Go toolchain
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.go-wasip3-cache.outcome == 'success' && steps.go-wasip3-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scratch/go-wasip3
          key: ${{ steps.go-wasip3-cache.outputs.cache-primary-key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        env:
          CLI: ${{ matrix.cli }}
        run: mise run build-cli -- "$CLI"
      # The GOROOT go runs with, from the checkout go was just built from.
      # It's in the component dir, so cached with it, and the smoke test
      # uses it.
      - name: Write go's GOROOT
        if: matrix.cli == 'go' && steps.cache.outputs.cache-hit != 'true'
        run: scripts/go-root.sh scratch/go-component
      - env:
          CLI: ${{ matrix.cli }}
        run: clis/smoke.sh "$CLI"
      # Its Go modules' licences, and the Go standard library's.
      - name: Write the notices
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CLI: ${{ matrix.cli }}
        run: |
          mise run install-license-classifier
          mise run notices -- "scratch/$CLI-component" "$CLI"
      # Saved from PRs too: a PR's caches are scoped to it (only main's are
      # seen by other branches), and only people with write access can run
      # CI here (the repo is private, so there are no fork PRs). Only after
      # the smoke test and notices pass.
      - name: Save the built component
        if: steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scratch/${{ matrix.cli }}-component
          key: ${{ steps.key.outputs.key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.cli }}-component
          path: |
            scratch/${{ matrix.cli }}-component/component.wasm
            scratch/${{ matrix.cli }}-component/*.cwasm
            scratch/${{ matrix.cli }}-component/manifest.toml
            scratch/${{ matrix.cli }}-component/provenance.json
            scratch/${{ matrix.cli }}-component/${{ matrix.cli }}.notices.md
            scratch/${{ matrix.cli }}-component/${{ matrix.cli }}.spdx.json
          if-no-files-found: error
          retention-days: 14

  # Publish what this run built to a throwaway registry on the runner, and read
  # it back: everything a real publish does except the destination.
  publish-dry-run:
    name: Publish (dry run)
    needs: [check, rust, c, go]
    if: ${{ !cancelled() && needs.check.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:3@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-binstall
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          install_args: rust cargo:wkg aqua:sigstore/cosign aqua:oras-project/oras
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-component'
          path: scratch
      - name: Publish to the local registry
        id: publish
        run: |
          shopt -s nullglob
          dirs=(scratch/*-component)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "Nothing was built, so there's nothing to publish."
            echo "results=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/publish.py publish --registry localhost:5000 --insecure \
            --fail-existing --out scratch/results.json "${dirs[@]}"
          python3 scripts/publish.py lock --results scratch/results.json
          cat scratch/results.json
      - id: dry-run-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-dry-run
          path: |
            scratch/results.json
            commands.lock
          if-no-files-found: ignore
          retention-days: 14
      # The sign job's steps, with a key made for this run instead of keyless
      # signing (which would certify a run that isn't the publish job's). The
      # results are read back from the artifact, as the sign job reads
      # `published`, so a path that only works locally fails here.
      # By the ID the upload just returned: looking it up by name straight
      # after uploading it sometimes found nothing ("Artifact not found for
      # name: publish-dry-run"); merge-multiple keeps the files directly in
      # path, as a download by name does
      - if: ${{ hashFiles('scratch/results.json') != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.dry-run-artifact.outputs.artifact-id }}
          merge-multiple: true
          path: scratch/published
      - name: Sign and attach to the local registry
        if: ${{ hashFiles('scratch/results.json') != '' }}
        env:
          COSIGN_PASSWORD: ''
        run: |
          cosign generate-key-pair --output-key-prefix scratch/dry-run
          python3 scripts/sign.py --insecure --key scratch/dry-run.key --pub scratch/dry-run.pub \
            scratch/published/scratch/results.json scratch/*-component

  # The real publish: manual runs on main with `publish` set, by Ben, after
  # the dry run. Packages are private and linked to this repo
  # (org.opencontainers.image.source).
  #
  # The actor check is the approval: required reviewers on an environment
  # need a paid plan for a private repo. triggering_actor covers re-runs of
  # Ben's run by someone else. It only holds while sd2k is the only one with
  # write access, since anyone who can push can change this workflow. Move
  # this to an environment with reviewers once the repo is public.
  # The one check to require: the build lanes' names come from their matrix,
  # and GitHub counts a skipped required check as passing (the dry run is
  # skipped when a lane fails), so this fails for any failed or cancelled
  # job instead, and passes when lanes were skipped for having no changes
  result:
    name: CI result
    needs: [changes, check, rust, c, go, publish-dry-run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A CI job failed or was cancelled"
          exit 1
      - run: echo "CI OK"

  publish:
    name: Publish to ghcr.io
    needs: publish-dry-run
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && !inputs.sign_run_id && github.ref == 'refs/heads/main' && github.actor == 'sd2k' && github.triggering_actor == 'sd2k' }}
    runs-on: ubuntu-latest
    # One publish at a time, never cancelled: the check that a version isn't
    # in the registry yet is only good while nothing else is pushing.
    concurrency:
      group: publish-ghcr
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      # Each built command's reference, `pushed` (false if it was already
      # there), layer digest and manifest_digest. The sign job attaches to
      # the latter; listing versions that were already there lets a re-run
      # sign what a failed run pushed.
      results: ${{ steps.publish.outputs.results }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-binstall
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          install_args: rust cargo:wkg
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-component'
          path: scratch
      - name: Publish to ghcr.io
        id: publish
        env:
          WKG_OCI_USERNAME: ${{ github.actor }}
          WKG_OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/publish.py publish --registry ghcr.io \
            --out scratch/results.json scratch/*-component
          python3 scripts/publish.py lock --results scratch/results.json
          echo "results=$(jq -c . scratch/results.json)" >> "$GITHUB_OUTPUT"
      # Even after a failure part way: results.json has what was pushed.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published
          path: |
            scratch/results.json
            commands.lock
          retention-days: 90
          # A re-run of this job uploads again under the same name.
          overwrite: true

  # Sign what publish pushed (or found already there) and attach its
  # provenance, notices and source offers (scripts/sign.py; it skips whatever
  # is already attached, so a re-run finishes a failed one). Keyless: the
  # certificate names this workflow on main, which is what consumers verify
  # (see the README).
  #
  # With `sign_run_id`, nothing is built or published: it signs what that
  # earlier run published, from that run's `published` and component
  # artifacts. Builds aren't reproducible, so a fresh run can't sign an
  # earlier run's versions (sign.py skips a layer it didn't build). Same
  # gate as publish.
  sign:
    name: Sign and attach
    needs: publish
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'sd2k' && github.triggering_actor == 'sd2k' && (needs.publish.result == 'success' || (inputs.sign_run_id && needs.publish.result == 'skipped')) }}
    runs-on: ubuntu-latest
    concurrency:
      group: publish-ghcr
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      # The OIDC token Fulcio issues the signing certificate for.
      id-token: write
      # Another run's artifacts, with sign_run_id.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A source offer is made from the commit a command was published
          # from, which a re-run may sign after main has moved on.
          fetch-depth: 0
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          install_args: aqua:sigstore/cosign aqua:oras-project/oras
          cache: false
      # Only a real publish's artifacts get signed: a PR or branch run can
      # upload an artifact named `published` too.
      - name: Check the run to sign
        if: ${{ inputs.sign_run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.sign_run_id }}
          REPO: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          run=$(gh api "repos/$REPO/actions/runs/$RUN_ID")
          workflow=${WORKFLOW_REF#"$REPO"/}
          workflow=${workflow%@*}
          problems=$(jq -r --arg workflow "$workflow" '
            [ (select(.path != $workflow) | "it ran \(.path), not \($workflow)"),
              (select(.event != "workflow_dispatch") | "its event was \(.event), not workflow_dispatch"),
              (select(.head_branch != "main") | "it ran on \(.head_branch), not main"),
              (select(.actor.login != "sd2k" or .triggering_actor.login != "sd2k")
                | "it was started by \(.actor.login) (triggered by \(.triggering_actor.login)), not sd2k"),
              (select(.status != "completed") | "it is \(.status), not completed")
            ] | .[]' <<< "$run")
          publish=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "Publish to ghcr.io") | .conclusion')
          if [ "$publish" != success ]; then
            problems+=$'\n'"its publish job's conclusion is '${publish:-missing}', not success"
          fi
          if [ -n "${problems//$'\n'/}" ]; then
            echo "::error::run $RUN_ID isn't a finished publish of this workflow on main by sd2k:"
            sed '/^$/d; s/^/- /' <<< "$problems"
            exit 1
          fi
      # This run's artifacts, or with sign_run_id, that run's (run-id is only
      # read when github-token is set).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-component'
          path: scratch
          run-id: ${{ inputs.sign_run_id || github.run_id }}
          github-token: ${{ inputs.sign_run_id && github.token || '' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: published
          path: scratch/published
          run-id: ${{ inputs.sign_run_id || github.run_id }}
          github-token: ${{ inputs.sign_run_id && github.token || '' }}
      - name: Sign and attach
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          TLOG: ${{ inputs.tlog_upload && '--tlog' || '--no-tlog' }}
          # The provenance names the run that built what's signed.
          ERYX_BUILD_RUN_ID: ${{ inputs.sign_run_id }}
        run: |
          # cosign reads the credentials oras stores (~/.docker/config.json).
          oras login ghcr.io -u "$ACTOR" --password-stdin <<< "$GH_TOKEN"
          # `published` holds scratch/results.json and commands.lock, at the
          # paths they were uploaded from.
          python3 scripts/sign.py "$TLOG" scratch/published/scratch/results.json scratch/*-component

  # Record the versions in commands.lock through a PR, so the index changes
  # are reviewed like any other. Results include versions that were already
  # published, so a re-run records what an earlier run missed. The PR is
  # opened with GITHUB_TOKEN, so CI doesn't run on it; it only changes the
  # lock. It needs "Allow GitHub Actions to create and approve pull requests"
  # in the repo's Actions settings.
  record:
    name: Record in commands.lock
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: published
          path: scratch/published
      - name: Open a PR
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          cp scratch/published/commands.lock commands.lock
          if git diff --quiet commands.lock; then
            echo "commands.lock already has every version."
            exit 0
          fi
          branch="publish/run-$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add commands.lock
          git commit -m "chore: record the commands published by run $RUN_ID"
          git push "https://x-access-token:$GH_TOKEN@github.com/$REPO" "$branch"
          gh pr create --head "$branch" --title "chore: record published commands (run $RUN_ID)" \
            --body "Versions published by https://github.com/$REPO/actions/runs/$RUN_ID, from its results.json."
