# rapidfuzz: C++ wrapped by Cython, built with scikit-build-core and CMake
# (see build.sh). eryx has no C++ exceptions, so a throw ends the run
# (no-exceptions.cpp), and WASI has no threads, so `workers` is ignored
# (wasi.patch).
name = "rapidfuzz"
version = "3.14.6"
sdist = "https://files.pythonhosted.org/packages/18/97/226c43b7b5d957bc3840ed52ea99eed261f99834c4619be7a4742cbaeafa/rapidfuzz-3.14.6.tar.gz"
sha256 = "e13a8160d017b499ec7a2fa9d0ce1ae2e7377080815785819f966fb235d4eb60"
# Not ninja: its package breaks under the WASI sysconfig, so scikit-build-core
# uses a ninja already on PATH, or make
requires = ["scikit-build-core>=0.11", "cmake"]
imports = [
    "rapidfuzz.utils_cpp",
    "rapidfuzz.fuzz_cpp",
    "rapidfuzz.process_cpp_impl",
    "rapidfuzz.distance._initialize_cpp",
    "rapidfuzz.distance.metrics_cpp",
]

[env]
# Fail the build rather than quietly falling back to pure Python
RAPIDFUZZ_BUILD_EXTENSION = "1"
