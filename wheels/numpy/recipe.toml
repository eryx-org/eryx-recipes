# numpy: C and some C++, built by meson-python with a cross file (build.sh),
# without BLAS/LAPACK (numpy's own fallback routines), threads or SIMD.
name = "numpy"
version = "2.5.4"
sdist = "https://files.pythonhosted.org/packages/95/b0/c7453d0b6e2073c3264468b106ee1563750cecc910965e67357e3698c83e/numpy-2.5.4.tar.gz"
sha256 = "9a94cf751c9ad8ebaa835bcd3d40dacf8534ad086b88c38029b65123c7999d2a"
requires = ["meson-python>=0.18.0", "Cython>=3.1.0", "ninja"]
# verify's sandbox only has what these import, not site-packages, so this
# includes numpy.ma, which np.unique imports on first use
imports = [
  "numpy.ma",
  "numpy._core._multiarray_umath",
  "numpy.linalg._umath_linalg",
  "numpy.random._generator",
  "numpy.fft._pocketfft_umath",
]
