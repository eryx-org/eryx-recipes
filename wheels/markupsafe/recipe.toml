# MarkupSafe's C speedups: C, setuptools, no dependencies. The simplest
# recipe there is: the default `pip wheel` build does it.
name = "markupsafe"
version = "3.0.3"
sdist = "https://files.pythonhosted.org/packages/7e/99/7690b6d4034fffd95959cbe0c02de8deb3098cc577c67bb6a24fe5d7caa7/markupsafe-3.0.3.tar.gz"
sha256 = "722695808f4b6457b320fdc131280796bdceb04ab50fe1795cd540799ebe1698"
# Installed in the build's venv
requires = ["setuptools>=70.1"]
# Imported in eryx after the build, so a module that doesn't load fails it
imports = ["markupsafe._speedups"]

[env]
# Fail the build rather than quietly falling back to pure Python
CIBUILDWHEEL = "1"
