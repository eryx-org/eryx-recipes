    "third_party/licenses/rust-LICENSE-APACHE",
    "third_party/licenses/rust-Unicode-3.0.txt",
]
rust_toolchain = "1.100.0"
artifacts = ["rg", "sd", "jaq", "sed", "find", "coreutils"]

