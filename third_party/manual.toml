# Third-party code in the published command components that isn't any one
# command's, listed in their notices by scripts/notices.py: what each lane's
# toolchain links. Each command's own entries (the tool and the libraries it
# statically links, its [[deps]]) are in its clis/<name>/notices.toml, in the
# same form but without `artifacts`: they go in that command's notices. A
# Rust command's crates (and its standard library's) come from cargo-about
# instead.
#
# Each entry:
#   name, version, license (SPDX), url  - what it is
#   files     - licence and notice texts, relative to the repo root, copied
#               from the source at its pin: a command's own in
#               clis/<name>/licenses/, one several commands use in
#               third_party/licenses/
#   artifacts - the commands (manifest names) whose notices it goes in
#   lanes     - or the lanes (manifests' `lang`) whose every command's
#               notices it goes in
#   cli, cli_commit / cli_sha256 - the manifest that builds it and its pin,
#               which `check` compares; cli_dep names one of its [[deps]]
#   rust_toolchain - code that comes with the Rust toolchain: the version,
#               which must be mise.toml's [tools] rust
#   sysroot_strings - strings that must appear in files of that toolchain's
#               sysroot, as { paths, strings }, so the version recorded here
#               is the one it ships
#   wasi_sdk  - code from the WASI SDK: the version, which must be
#               mise.toml's wasi_sdk_version
#   go_fork_commit - code from the wasip3 Go fork: the commit, which must be
#               the one scripts/bootstrap-go-wasip3.sh builds; the version
#               must start with that script's GO_WASIP3_REF

# ---------------------------------------------------------------------------
# What each lane links (LANE_ENTRIES in scripts/notices.py)
# ---------------------------------------------------------------------------

[[component]]
name = "wasi-libc (WASI SDK)"
version = "wasi-sdk-33 (161b3195)"
license = "Apache-2.0 WITH LLVM-exception AND Apache-2.0 AND MIT AND BSD-2-Clause AND BSD-3-Clause AND CC0-1.0"
url = "https://github.com/WebAssembly/wasi-libc/tree/161b3195fc2558d2b1ba3eb9ffae3b2b47407623"
# The C lane builds against the WASI SDK's sysroot. wasi-libc itself (its
# LICENSE lists the parts it derives from), the musl code in it, cloudlibc
# and musl-fts; dlmalloc is CC0. As eryx's entry for the same SDK.
files = [
    "third_party/licenses/wasi-libc-LICENSE",
    "third_party/licenses/wasi-libc-LICENSE-APACHE-LLVM",
    "third_party/licenses/wasi-libc-LICENSE-APACHE",
    "third_party/licenses/wasi-libc-LICENSE-MIT",
    "third_party/licenses/wasi-libc-musl-COPYRIGHT",
    "third_party/licenses/wasi-libc-cloudlibc-LICENSE",
    "third_party/licenses/wasi-libc-musl-fts-COPYING",
]
wasi_sdk = "wasi-sdk-33"
lanes = ["c"]

[[component]]
name = "LLVM compiler-rt builtins (WASI SDK)"
version = "wasi-sdk-33 (llvm-project 4434dabb)"
license = "Apache-2.0 WITH LLVM-exception"
url = "https://github.com/llvm/llvm-project/tree/4434dabb69916856b824f68a64b029c67175e532/compiler-rt"
# clang links libclang_rt.builtins into every wasm program it builds.
files = ["third_party/licenses/llvm-compiler-rt-LICENSE.TXT"]
wasi_sdk = "wasi-sdk-33"
lanes = ["c"]

[[component]]
name = "wasi-libc (Rust's wasm targets)"
version = "wasi-sdk-34 (2e6fb9d8)"
license = "Apache-2.0 WITH LLVM-exception AND Apache-2.0 AND MIT AND BSD-2-Clause AND BSD-3-Clause AND CC0-1.0"
url = "https://github.com/WebAssembly/wasi-libc/tree/2e6fb9d8ee0cdf9e431fbcabe8af3115de000a13"
# The wasi-libc in Rust's self-contained wasm32-wasip2 sysroot, which the
# Rust lane links. Rust 1.100.0 builds that target with wasi-sdk-34
# (src/ci/docker/host-x86_64/dist-various-2/Dockerfile at its tag), whose
# src/wasi-libc is at the commit above; its libc.a reports clang
# 23.1.0-wasi-sdk (llvm 895aa2c8). Only musl's COPYRIGHT differs from
# wasi-sdk-33's. On a toolchain bump, look both up again; the check fails
# when the sysroot's libc.a no longer carries that LLVM.
files = [
    "third_party/licenses/wasi-libc-LICENSE",
    "third_party/licenses/wasi-libc-LICENSE-APACHE-LLVM",
    "third_party/licenses/wasi-libc-LICENSE-APACHE",
    "third_party/licenses/wasi-libc-LICENSE-MIT",
    "third_party/licenses/wasi-libc-wasi-sdk-34-musl-COPYRIGHT",
    "third_party/licenses/wasi-libc-cloudlibc-LICENSE",
    "third_party/licenses/wasi-libc-musl-fts-COPYING",
]
rust_toolchain = "1.100.0"
sysroot_strings = { paths = ["lib/rustlib/wasm32-wasip2/lib/self-contained/libc.a"], strings = ["llvm-project 895aa2c896ada719451be2e3673c83da8ddf1141"] }
lanes = ["rust"]

[[component]]
name = "The Rust standard library"
version = "1.100.0 (0ef1bc38)"
license = "(MIT OR Apache-2.0) AND Unicode-3.0"
url = "https://github.com/rust-lang/rust/tree/1.100.0"
# The project's own licence texts for std, core, alloc and the rest of
# library/, and Unicode-3.0 for core's Unicode tables
# (library/core/src/unicode/unicode_data.rs, per the project's REUSE.toml);
# their dependencies (hashbrown, compiler_builtins, ...) are listed from
# rust-src.
files = [
    "third_party/licenses/rust-COPYRIGHT",
    "third_party/licenses/rust-LICENSE-MIT",
    "third_party/licenses/rust-LICENSE-APACHE",
    "third_party/licenses/rust-Unicode-3.0.txt",
]
rust_toolchain = "1.100.0"
lanes = ["rust"]

[[component]]
name = "The Go standard library (wasip3 fork)"
version = "wasip3-0.3.0-go1.27.4-branches-notetsleepg (d09b5e11)"
license = "BSD-3-Clause"
url = "https://github.com/sd2k/go/tree/d09b5e114a563faeda64feaeb6d1b0256ddc5641"
# The Go lane's standard library and runtime: Go 1.27.4 ported to WASI 0.3
# (scripts/bootstrap-go-wasip3.sh). Go's LICENSE and its patent grant, which
# also cover go and its tools, built from the same fork.
files = ["third_party/licenses/go-LICENSE", "third_party/licenses/go-PATENTS"]
go_fork_commit = "d09b5e114a563faeda64feaeb6d1b0256ddc5641"
lanes = ["go"]
