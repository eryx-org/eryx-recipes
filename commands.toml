# The published version of each command (#5): `<upstream>-r.<n>`.
#
# The table key is the command's name, `<namespace>.<name>` (`eryx:rg` is
# `[eryx.rg]`), which is also its registry path:
# ghcr.io/eryx-org/commands/<namespace>/<name>:<version>. GPL commands
# (clis/gpl/) use the `eryx-gpl` namespace.
#
# - `version`: the upstream version, then `-r.<n>`, our build revision. Bump
#   `n` for any change to the built component at the same upstream version: its
#   manifest, patches or shims, or the pinned eryx-build, Rust, WASI SDK or Go
#   fork. Go back to `r.1` when the upstream version changes.
#   `scripts/publish.py check-versions` enforces this on PRs. Published
#   versions are never overwritten.
# - `upstream` (optional): the upstream version, when it can't be read from the
#   manifest's `source.ref` once a leading `v` or `<name>-` is dropped and `_`
#   becomes `.`.
# - `manifest` (optional): the recipe, if it isn't `clis/<name>.toml` (or
#   `clis/gpl/<name>/<name>.toml` for `eryx-gpl`).
# - `names` (optional): every name a multicall command answers to, recorded in
#   its `run.eryx.command.names` annotation.
# - `multicall` (optional): `true` takes `names` from the manifest's cargo
#   `--features` list instead, one tool per feature.
# - `fetched` (optional): the recipe isn't kept here but fetched from
#   eryx-org/eryx at the commit in this mise.toml var (`mise run
#   fetch-<name>`; `mise run bump-<name>` moves it). Moving the pin counts as a
#   change to the command's build inputs.
# - `pins` (optional): mise.toml pins its build uses that its lane doesn't,
#   as `<table>.<key>` (`["vars.wasi_sdk_version"]` for a Rust command that
#   compiles C). They count as build inputs, like the lane's.

# The same build as eryx's embedded coreutils, from eryx's recipe
# (eryx-commands#7).
[eryx.coreutils]
version = "0.9.0-r.3"
multicall = true
fetched = "coreutils_rev"

[eryx.awk]
version = "20261106.0.0-r.2"
upstream = "20261106.0.0"

[eryx.curl]
version = "8.20.0-r.3"

[eryx.find]
version = "0.11.0-r.3"
# Its onig crate compiles Oniguruma's C with the WASI SDK's clang.
pins = ["vars.wasi_sdk_version"]

[eryx.gh]
version = "2.87.3-r.5"

[eryx.jaq]
version = "3.1.2-r.3"

[eryx.jq]
version = "1.8.2-r.3"

[eryx.rg]
version = "15.1.0-r.3"

[eryx.sd]
version = "1.1.0-r.3"

[eryx.sed]
version = "0.3.0-r.2"

[eryx.sqlite3]
version = "3.53.2-r.3"

[eryx-gpl.git]
version = "2.56.1-r.3"
