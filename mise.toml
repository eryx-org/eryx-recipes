# Toolchains and tools for building and publishing the command components.
# eryx-build itself is pinned here once it's published to crates.io
# (eryx-org/eryx#997).

[tools]
rust = { version = "1.100.0", profile = "default" }
# Workflow linting. actionlint runs shellcheck over every `run:` script when
# it finds it on PATH, so pin that too.
actionlint = "1.7.12"
shellcheck = "0.11.0"

# Runs the commands' smoke tests. Keep it on the wasmtime version eryx uses,
# so the commands are tested against the WASI versions eryx's host provides.
[tools."aqua:bytecodealliance/wasmtime"]
version = "50.0.1"

# `wit-bindgen c`, for C recipes with a `[build] wit` (git's eryx:process
# bindings). The same version as eryx's guests use.
[tools."github:bytecodealliance/wit-bindgen"]
version = "0.63.0"

# Inspects built components (the C and Go lanes, smoke checks). The same
# version as eryx's.
[tools."cargo:wasm-tools"]
version = "1.263.0"

# The commands' third-party notices. 0.9 knows wasm32-wasip3.
[tools."cargo:cargo-about"]
version = "0.9.3"

# Publishes the commands to the registry in wkg's layout (#5).
[tools."cargo:wkg"]
version = "0.16.2"

# Signs the published commands and attaches their provenance (#6), and
# attaches their notices and source offers as OCI referrers.
[tools."aqua:sigstore/cosign"]
version = "3.1.4"
[tools."aqua:oras-project/oras"]
version = "1.4.0"

# The WASI SDK isn't in [tools]: on PATH it breaks host compilation (Rust
# picks up wasm clang for proc-macro builds), so builds install it on demand.
[vars]
wasi_sdk_version = "wasi-sdk-33"
# The eryx commit whose eryx-build builds the commands, and whose WIT
# (wit/process.wit) git is built against. Until eryx-build is on crates.io
# (eryx-org/eryx#997) it's installed from git at this commit. It needs to be
# at least eryx-org/eryx#1004, whose provenance.json records the eryx-build
# version and the WIT imports the registry annotations come from, and
# eryx-org/eryx#1106, whose exit-code shim lets C commands exit with statuses
# above 1 (the smoke tests check them).
eryx_rev = "1f04d02e674b5010ce7f8408a7300befeef77819"
# The eryx commit coreutils' recipe (clis/coreutils.toml and its uucore patch)
# is fetched from: eryx keeps building it for its embedded coreutils, and we
# publish the same build. `mise run bump-coreutils` moves it.
coreutils_rev = "b65e7e53ae02029a878f58a312634721a2d6eaa9"
# google/licenseclassifier's identify_license, which classifies a Go
# command's module licence files for its notices. Installed with the host
# Go into scratch/tools, like eryx-build.
license_classifier_version = "v2.0.0"

[tasks.install-eryx-build]
description = "Install eryx-build from eryx-org/eryx at vars.eryx_rev into scratch/tools"
run = """
#!/usr/bin/env bash
set -euo pipefail
BIN=scratch/tools/bin/eryx-build
if [ -x "$BIN" ] && [ "$(cat scratch/tools/eryx-rev 2>/dev/null)" = "{{vars.eryx_rev}}" ]; then
    exit 0
fi
cargo install --locked --quiet --root scratch/tools \
    --git https://github.com/eryx-org/eryx --rev "{{vars.eryx_rev}}" eryx-build
echo "{{vars.eryx_rev}}" > scratch/tools/eryx-rev
"""

[tasks.install-license-classifier]
description = "Install identify_license at vars.license_classifier_version into scratch/tools (needs a host Go)"
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ -x scratch/tools/bin/identify_license ] && [ "$(cat scratch/tools/license-classifier-version 2>/dev/null)" = "{{vars.license_classifier_version}}" ]; then
    exit 0
fi
mkdir -p scratch/tools/bin
GOBIN="$PWD/scratch/tools/bin" go install "github.com/google/licenseclassifier/v2/tools/identify_license@{{vars.license_classifier_version}}"
echo "{{vars.license_classifier_version}}" > scratch/tools/license-classifier-version
"""

[tasks.ensure-wasi-sdk]
description = "Install the WASI SDK if it isn't installed"
run = """
#!/usr/bin/env bash
set -euo pipefail
SPEC="github:WebAssembly/wasi-sdk@{{vars.wasi_sdk_version}}"
mise where "$SPEC" >/dev/null 2>&1 || mise install "$SPEC"
[ -f "$(mise where "$SPEC")/bin/clang" ] || { echo "WASI SDK install incomplete: no clang" >&2; exit 1; }
"""

[tasks.build-cli]
description = "Build a command from clis/<name>.toml. Usage: mise run build-cli -- <name|path.toml>"
depends = ["install-eryx-build"]
run = """
#!/usr/bin/env bash
set -euo pipefail
NAME="${1:?Usage: mise run build-cli -- <name|path.toml> (e.g. rg, curl, gh)}"
# The C lane needs the WASI SDK. Export it if installed, but don't install it
# for Rust and Go builds; C manifests point at ensure-wasi-sdk when it's missing.
if SDK="$(mise where "github:WebAssembly/wasi-sdk@{{vars.wasi_sdk_version}}" 2>/dev/null)"; then
    export WASI_SDK_PATH="$SDK"
fi
scratch/tools/bin/eryx-build "$NAME"
"""

[tasks.list-clis]
description = "List the command manifests"
depends = ["install-eryx-build"]
run = "scratch/tools/bin/eryx-build --list"

[tasks.check-clis]
description = "Validate the command manifests without building"
depends = ["install-eryx-build"]
run = """
#!/usr/bin/env bash
set -euo pipefail
# A fetched recipe must be the one its pin names, not a stale local copy.
if [ -e clis/coreutils.toml ] && [ "$(cat scratch/fetched/coreutils_rev 2>/dev/null)" != "{{vars.coreutils_rev}}" ]; then
    echo "clis/coreutils.toml wasn't fetched at vars.coreutils_rev; run mise run fetch-coreutils" >&2
    exit 1
fi
scratch/tools/bin/eryx-build --check
"""

[tasks.check-wit]
description = "Check wit/process.wit matches eryx's at vars.eryx_rev"
run = """
#!/usr/bin/env bash
set -euo pipefail
curl -fsSL "https://raw.githubusercontent.com/eryx-org/eryx/{{vars.eryx_rev}}/crates/eryx-runtime/wit/deps/process.wit" \
    | diff - <(tail -n +4 wit/process.wit) \
    || { echo "wit/process.wit differs from eryx's at {{vars.eryx_rev}}; re-vendor it" >&2; exit 1; }
"""

[tasks.ensure-rust-src]
description = "Install rust-src and the wasm32-wasip2 target, which the notices read the standard library and its wasi-libc from"
run = "rustup component add rust-src && rustup target add wasm32-wasip2"

[tasks.notices]
description = "Write built commands' notices. Usage: mise run notices -- OUTDIR NAME..."
depends = ["ensure-rust-src"]
run = "python3 scripts/notices.py generate"

[tasks.notices-check]
description = "Check every published command, its [[deps]] and its lane's libraries have current notice entries"
depends = ["ensure-rust-src"]
run = "python3 scripts/notices.py check"

[tasks.fetch-coreutils]
description = "Fetch coreutils' recipe from eryx-org/eryx at vars.coreutils_rev into clis/ (git-ignored)"
run = """
#!/usr/bin/env bash
set -euo pipefail
for f in clis/coreutils.toml clis/patches/patch-uucore-wasip2.sh; do
    curl -fsSL -o "$f" "https://raw.githubusercontent.com/eryx-org/eryx/{{vars.coreutils_rev}}/$f"
done
chmod +x clis/patches/patch-uucore-wasip2.sh
# The pin it was fetched at, which check-clis and check-versions compare.
mkdir -p scratch/fetched
echo "{{vars.coreutils_rev}}" > scratch/fetched/coreutils_rev
"""

[tasks.bump-coreutils]
description = "Move vars.coreutils_rev to the newest eryx commit that changed coreutils' recipe, and bump its version. Usage: mise run bump-coreutils [-- BRANCH] (default multi-guest). A new upstream version also needs third_party/manual.toml's uutils entry (version, url, cli_commit) and its licence file updated by hand; notices-check fails until then"
run = """
#!/usr/bin/env bash
set -euo pipefail
python3 scripts/publish.py bump eryx:coreutils --branch "${1:-multi-guest}"
mise run fetch-coreutils
"""
